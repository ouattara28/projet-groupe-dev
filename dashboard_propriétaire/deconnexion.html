<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitéPay — Déconnexion</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="logout-body">

    <div class="logout-card">
        <!-- Icône animée -->
        <div class="logout-icon-wrapper">
            <span class="material-symbols-rounded logout-icon">logout</span>
        </div>

        <!-- Titre & Message -->
        <h1 class="logout-title">Déconnexion en cours...</h1>
        <p class="logout-message">
            Merci d'avoir utilisé <strong>CitéPay</strong>. Votre session est en cours de fermeture en toute sécurité.
        </p>

        <!-- Loader / Barre de progression pour votre pote en JS -->
        <div class="logout-loader" id="logoutLoader">
            <div class="loader-bar"></div>
        </div>

        <!-- Actions utilisateur -->
        <div class="logout-actions">
            <a href="connexion.html" class="btn-primary btn-block">
                Se reconnecter
            </a>
            <a href="index.html" class="btn-secondary btn-block">
                Retour à l'accueil
            </a>
        </div>
    </div>

    <!-- Le script JS sera géré par Ismael -->
    <script src="logout.js"></script>
</body>
</html>
