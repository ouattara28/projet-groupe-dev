<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitéPay - Inscription Propriétaire</title>
    <!-- Lien vers le fichier CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="material-symbols-rounded">person_add</span>
                </div>
                <h1 class="auth-title">Créer un compte</h1>
                <p class="auth-subtitle">Rejoignez CitéPay en tant que propriétaire</p>
            </div>

            <!-- Formulaire d'inscription -->
            <form class="auth-form" action="traitement-inscription.php" method="POST">
                <div class="form-group">
                    <label class="form-label">Nom complet</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">badge</span>
                        <input type="text" class="form-input" placeholder="Votre nom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">mail</span>
                        <input type="email" class="form-input" placeholder="votre@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">lock</span>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-submit">S'inscrire</button>
            </form>

            <div class="auth-footer">
                Vous avez déjà un compte ? <a href="connexion.html">Connectez-vous</a>
            </div>
        </div>
    </div>

</body>
</html>
