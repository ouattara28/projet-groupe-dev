<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Espace Client</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="material-symbols-rounded">lock</span>
                </div>
                <h1 class="auth-title">Bienvenue !</h1>
                <p class="auth-subtitle">Veuillez saisir vos identifiants pour accéder à votre espace</p>
            </div>

            <form class="auth-form" id="loginForm" autocomplete="on">
                
                <div class="form-group">
                    <label for="email" class="form-label">Adresse e-mail</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">mail</span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="votre.email@domaine.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">lock</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher/Masquer le mot de passe">
                            <span class="material-symbols-rounded" id="eyeIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Se souvenir de moi</span>
                    </label>
                    <a href="mot-de-passe-oublie.html" class="forgot-link">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-primary btn-submit" id="submitBtn">
                    <span>Se connecter</span>
                    <span class="material-symbols-rounded">arrow_forward</span>
                </button>

            </form>

            <div class="auth-footer">
                Vous n'avez pas encore de compte ? <a href="inscription.html">Créer un compte</a>
            </div>

        </div>
    </div>

    <script src="dark-mode.js"></script>
    <script src="validation-formulaire.js"></script>
    <script src="login.js"></script>
</body>
</html>
